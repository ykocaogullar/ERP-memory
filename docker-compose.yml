services:
  db:
    image: pgvector/pgvector:pg15
    container_name: erp_db
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_network

  migrations:
    image: postgres:15
    container_name: erp_migrations
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: erp_password
    volumes:
      - ./db/migrations:/migrations
    command: >
      sh -c "
      sleep 5 &&
      psql -h db -U erp_user -d erp_db -f /migrations/001_initial_schema.sql
      "
    networks:
      - erp_network

  seed:
    image: postgres:15
    container_name: erp_seed
    depends_on:
      - migrations
    environment:
      PGPASSWORD: erp_password
    volumes:
      - ./db/seeds:/seeds
    command: >
      sh -c "
      sleep 10 &&
      psql -h db -U erp_user -d erp_db -f /seeds/seed_data.sql
      "
    networks:
      - erp_network

  api:
    build: .
    container_name: erp_api
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@db:5432/erp_db
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: erp_password
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENABLE_VECTORS: ${ENABLE_VECTORS:-true}
      ENABLE_PII_REDACTION: ${ENABLE_PII_REDACTION:-true}
      ENABLE_SEMANTIC_RELATIONSHIPS: ${ENABLE_SEMANTIC_RELATIONSHIPS:-true}
      ENTITY_EMBEDDING_ENABLED: ${ENTITY_EMBEDDING_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./api:/app/api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080 --reload
    networks:
      - erp_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  erp_network:
    driver: bridge